plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

def effectiveModId = mod_id.toString()
def effectiveMinecraftVersion = minecraft_version.toString()
def effectiveMinecraftVersionRange = (findProperty('minecraft_version_range') ?: "[${effectiveMinecraftVersion}]").toString()
def effectiveNeoVersion = neo_version.toString()
def effectiveNeoVersionRange = (findProperty('neo_version_range') ?: "[${effectiveNeoVersion},)").toString()
def effectiveLoaderVersionRange = (findProperty('loader_version_range') ?: '[4,)').toString()
def effectiveParchmentMappingsVersion = (findProperty('parchment_mappings_version') ?: '').toString()
def effectiveSparkVersion = neoforge_spark_version.toString()
def effectiveDevPlayerName = (findProperty('dev_player_name') ?: 'Dev').toString()
def effectiveTargetJavaVersion = (findProperty('target_java_version') ?: '21').toInteger()
def sharedBuildRoot = layout.projectDirectory.dir('build')
def runDirectory = { String name ->
    def directory = file("runs/neoforge/${effectiveMinecraftVersion}/${name}")
    directory.mkdirs()
    return directory
}

base {
    archivesName = "${effectiveModId}-neoforge-${effectiveMinecraftVersion}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(gradle_java_version.toInteger())
}

tasks.withType(JavaCompile).configureEach {
    options.release = effectiveTargetJavaVersion
    options.encoding = 'UTF-8'
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = uri('https://api.modrinth.com/maven')
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

neoForge {
    version = effectiveNeoVersion

    if (!effectiveParchmentMappingsVersion.isBlank()) {
        parchment {
            mappingsVersion = effectiveParchmentMappingsVersion
            minecraftVersion = effectiveMinecraftVersion
        }
    }

    runs {
        client {
            client()
            gameDirectory = runDirectory('client')
            programArguments.addAll '--username', effectiveDevPlayerName
            systemProperty 'neoforge.enabledGameTestNamespaces', effectiveModId
        }

        server {
            server()
            gameDirectory = runDirectory('server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', effectiveModId
        }

        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = runDirectory('gameTestServer')
            systemProperty 'neoforge.enabledGameTestNamespaces', effectiveModId
        }

        data {
            data()
            gameDirectory = runDirectory('data')
            programArguments.addAll '--mod', effectiveModId, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/common/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${effectiveModId}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.matching { it.name == 'createMinecraftArtifacts' }.configureEach {
    def gradleJavaExecutable = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(gradle_java_version.toInteger())
    }.map { launcher -> launcher.executablePath.asFile.absolutePath }
    javaExecutable.set(gradleJavaExecutable)
    toolsJavaExecutable.set(gradleJavaExecutable)
}

sourceSets {
    main {
        java {
            setSrcDirs([
                    'src/common/java',
                    "src/versions/${effectiveMinecraftVersion}/common/java",
                    'src/loaders/neoforge/java',
                    "src/versions/${effectiveMinecraftVersion}/neoforge/java"
            ])
        }
        resources {
            setSrcDirs([
                    'src/common/resources',
                    "src/versions/${effectiveMinecraftVersion}/common/resources",
                    'src/loaders/neoforge/resources',
                    "src/versions/${effectiveMinecraftVersion}/neoforge/resources",
                    'src/generated/resources'
            ])
            exclude '**/.gitkeep'
        }
    }
}

dependencies {
    runtimeOnly "maven.modrinth:spark:${effectiveSparkVersion}"
}

tasks.withType(JavaExec).configureEach {
    standardInput = System.in
}

tasks.named('clean', Delete).configure {
    delete sharedBuildRoot.dir('work')
    delete sharedBuildRoot.dir('libs')
    delete sharedBuildRoot.dir('classes')
    delete sharedBuildRoot.dir('resources')
    delete sharedBuildRoot.dir('generated')
    delete sharedBuildRoot.dir('tmp')
    delete sharedBuildRoot.dir('reports')
}

tasks.named('jar').configure {
    destinationDirectory = sharedBuildRoot.dir('libs')
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [minecraft_version      : effectiveMinecraftVersion,
                             minecraft_version_range: effectiveMinecraftVersionRange,
                             neo_version            : effectiveNeoVersion,
                             neo_version_range      : effectiveNeoVersionRange,
                             loader_version_range   : effectiveLoaderVersionRange,
                             mod_id                 : effectiveModId,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/loaders/neoforge/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.register('buildNeoForge') {
    group = 'build'
    description = 'Builds the NeoForge 1.21.1 jar.'
    dependsOn tasks.named('build')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
